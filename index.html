<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="管理及查詢遊戲好友擁有的花種">
<title>好友花種圖鑑</title>
<link rel="stylesheet" href="./style.css?v=two-rows-16"><script defer src="./seed.js"></script><script defer src="./app.js?v=ocr-scroll-15"></script>
<script defer src="./flower-cards.js?v=two-rows-16"></script>
<style>
.flower-card-button{display:inline-flex;vertical-align:middle;padding:0;margin:0 8px 0 0;border-radius:8px;overflow:hidden;background:#f1f6ee;line-height:0}
.flower-card-button img{width:42px;height:42px;object-fit:cover}
.flower-card-dialog{width:min(370px,calc(100vw - 32px));padding:16px;border:1px solid #dce4db;border-radius:15px;color:#243a30;text-align:center}
.flower-card-dialog::backdrop{background:#0f1e18a0}
.flower-card-dialog img{display:block;width:min(100%,280px);height:auto;margin:0 auto 12px;border-radius:10px;image-rendering:auto}
.flower-card-dialog h2{margin:0 0 12px;font-size:1.1rem}
.friend-management{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:12px}
.friend-management summary{cursor:pointer;font-weight:650}
.friend-management .actions{margin-top:8px}
.friend-management ul{list-style:none;padding:0;max-height:320px;overflow:auto}
.friend-management li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.friend-management li button{flex-shrink:0}
.friend-management button.danger{color:#9c302c}
#friend-management-status:empty{display:none}
nav{flex-wrap:wrap}
.flower-card-dialog:has(#card-edit:not([hidden])){width:min(460px,calc(100vw - 24px));max-height:90dvh;overflow:auto}
#card-edit{text-align:left}
#card-edit canvas{display:block;width:min(280px,100%);height:auto;margin:8px auto;border-radius:8px}
#card-crop-preview{background:conic-gradient(#e7e4e0 25%,#f8f6f3 0 50%,#e7e4e0 0 75%,#f8f6f3 0) 0 0/20px 20px}
#card-edit label{display:block;margin:8px 0}
#card-edit input[type=range]{display:block;width:100%;margin:0}
#card-edit .actions{margin-top:12px}
#card-edit-status{min-height:1.5em;margin:6px 0}
[hidden]{display:none!important}
.gallery-filters{display:grid;grid-template-columns:2fr 1fr;gap:12px}
#gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
#gallery-grid button{display:grid;grid-template-rows:auto 1fr auto;gap:5px;min-width:0;padding:8px;text-align:center;background:var(--grade-surface,#fff);border:1px solid var(--grade-border,#d7e4db);border-radius:12px}
#gallery-grid button:hover,#gallery-grid button:focus-visible{border-color:var(--grade-ink,#638876);background:var(--grade-bg,#f5faf6)}
#gallery-grid img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:8px;background:var(--grade-bg,#f1f6ee)}
#gallery-grid .gallery-name{align-self:center;line-height:1.25;overflow-wrap:anywhere}
#gallery-grid .gallery-grade{font-size:.8rem;line-height:1.25}
@media(max-width:400px){#gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
</head>
<body>
<header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">✿</span><span>好友花種圖鑑</span></div></header>
<main class="wrap">
  <section class="intro"><h1>好友花種圖鑑</h1><p>查找好友的花種，或上傳遊戲截圖更新收藏。</p>
    <div class="stats"><div><strong id="friend-count">—</strong> 位好友</div><div><strong id="flower-count">—</strong> 個花種</div><div><strong id="record-count">—</strong> 筆持有紀錄</div></div>
  </section>
  <nav aria-label="花冊功能"><button type="button" data-view="catalog" aria-current="page">花種收藏</button><button type="button" data-view="gallery">圖庫</button><button type="button" id="export-backup">匯出好友備份</button></nav>
  <div class="actions backup-import">
    <button type="button" data-view="editor" data-admin hidden>新增／更新好友</button>
    <button type="button" id="import-backup" data-admin hidden>匯入好友備份</button>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
  </div>
  <details id="admin-panel" style="margin:12px 0">
    <summary id="admin-panel-title">管理員登入</summary>
    <form id="admin-login">
    <label>GitHub 更新權杖<input id="shared-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button id="admin-login-button" type="submit">登入</button>
    </form>
    <p id="admin-login-status" role="status"></p>
    <button id="admin-logout" data-admin hidden type="button">登出</button>
    <button id="publish-shared" data-admin hidden type="button">發布目前好友資料</button>
    <p id="shared-admin-status" role="status"></p>
  </details>
  <details data-admin hidden style="margin:12px 0">
    <summary>統一更正花名</summary>
    <form id="rename-flower-form">
      <div class="tools">
        <label>原花名<input id="old-flower-name" list="rename-flower-options" maxlength="80" required></label>
        <label>正確花名<input id="new-flower-name" list="rename-flower-options" maxlength="80" required></label>
      </div>
      <datalist id="rename-flower-options"></datalist>
      <p>更正會套用到圖鑑、圖卡與所有好友。若正確花名已存在，重複的持有紀錄會合併。</p>
      <button id="save-flower-name" type="submit">儲存共用花名</button>
      <p id="rename-flower-status" role="status"></p>
    </form>
  </details>
  <p id="shared-status" role="status"></p>
  <p id="connection" role="status">正在載入花冊…</p>
  <section id="catalog" class="page" hidden>
    <div class="tools">
      <label>搜尋花名<input id="search" type="search" placeholder="例如：滿天星"></label>
      <div class="friend-filter">
        <label>選擇好友<select id="filter"><option value="">所有好友</option></select></label>
        <label>搜尋好友<input id="friend-filter-search" type="search" placeholder="輸入部分名字" autocomplete="off"></label>
        <span id="friend-filter-status" role="status"></span>
      </div>
      <div class="grade-filter"><span id="catalog-grade-label">品級</span><select aria-labelledby="catalog-grade-label" id="catalog-grade"><option value="">全部品級</option><option>仙品</option><option>華品</option><option>珍品</option><option>普通</option><option>凡品</option><option value="ungraded">未分類</option></select><div class="grade-options" role="group" aria-labelledby="catalog-grade-label" hidden></div></div>
    </div>
    <div class="catalog-view-options">
      <label>顯示方式<select id="layout"><option value="cards">收藏卡片</option><option value="list">持有人清單</option><option value="matrix">好友持有矩陣</option></select></label>
      <label class="owned-filter"><input id="catalog-owned" type="checkbox" checked> 只顯示已收藏花種</label>
    </div>
    <h2 class="catalog-heading">花種擁有者查詢</h2>
    <div class="results"><p id="summary"></p><div class="pages"><button id="prev" type="button">上一頁</button><span id="page-number"></span><button id="next" type="button">下一頁</button></div></div>
    <div id="catalog-cards" class="flower-grid" tabindex="0" role="region" aria-label="花種卡片" hidden></div>
    <div class="table-frame" tabindex="0" aria-label="花種及好友持有紀錄"><table id="inventory"></table></div>
  </section>
  <section id="gallery" class="page" hidden aria-label="花朵圖庫">
    <div class="gallery-filters">
      <label>搜尋圖卡<input id="gallery-search" type="search" placeholder="輸入花名"></label>
      <div class="grade-filter"><span id="gallery-grade-label">花朵品級</span><select aria-labelledby="gallery-grade-label" id="gallery-grade"><option value="">全部品級</option><option>仙品</option><option>華品</option><option>珍品</option><option>普通</option><option>凡品</option><option value="ungraded">未分類</option></select><div class="grade-options" role="group" aria-labelledby="gallery-grade-label" hidden></div></div>
    </div>
    <div class="results"><p id="gallery-count" aria-live="polite"></p>
      <div class="pages"><button id="gallery-prev" type="button">上一頁</button><span id="gallery-page"></span><button id="gallery-next" type="button">下一頁</button></div>
    </div>
    <button id="gallery-upload" data-admin hidden type="button">新增／更換圖卡</button>
    <div id="gallery-grid" tabindex="0" role="region" aria-label="圖庫卡片"></div>
  </section>
  <section id="editor" class="page" hidden>
    <form id="entry">
      <div class="tools"><label>選擇好友<select id="friend"><option value="">新增好友</option></select></label>
      <label id="new-field">新好友名稱<input id="new-friend" maxlength="80" placeholder="輸入遊戲暱稱"></label></div>
      <details id="friend-management" class="friend-management" hidden>
        <summary>管理這位好友</summary>
        <fieldset id="friend-management-fields" style="border:0;padding:0;margin:10px 0 0;min-width:0">
          <label>好友名稱<input id="rename-friend" maxlength="80"></label>
          <div class="actions">
            <button id="save-friend-name" type="button">儲存新名字</button>
            <button id="delete-friend" class="danger" type="button">刪除整位好友</button>
          </div>
          <h3>已儲存的花</h3>
          <p id="friend-flower-empty" hidden>這位好友目前沒有花。</p>
          <ul id="friend-flowers" aria-label="已儲存的花"></ul>
        </fieldset>
        <p id="friend-management-status" role="status"></p>
      </details>
      <div class="upload"><label for="screenshots">上傳遊戲截圖</label><p>可選多張圖片。請確認截圖中顯示清楚的花名。</p><input type="file" id="screenshots" accept="image/*" multiple>
      <div id="previews" class="previews"></div></div>
      <label for="manual">手動輸入花名（選填）</label>
      <textarea id="manual" rows="3" placeholder="每行一個花名，也可用頓號分隔"></textarea>
      <button class="primary" id="review-button">前往確認</button>
      <p id="progress" role="status"></p>
    </form>
    <section id="review" hidden>
      <h2>確認花名</h2><p id="target"></p><div id="review-images" class="previews"></div>
      <div id="review-rows"></div>
      <button type="button" id="add-row">新增一列</button>
      <details id="ocr-details" hidden><summary>查看原始辨識文字</summary><pre id="ocr-raw"></pre></details>
      <p id="review-message" role="status"></p>
      <div class="actions"><button type="button" id="back">返回上傳</button><button class="primary" type="button" id="save">確認並儲存</button></div>
    </section>
  </section>
  <template id="card-edit-template">
    <form id="card-edit" hidden>
      <label>花名 <input id="card-edit-name" maxlength="80" required></label>
      <label>選擇截圖 <input id="card-edit-file" type="file" accept="image/*" required></label>
      <div id="card-crop-controls" hidden>
        <label>裁切位置
          <select id="card-crop-position">
            <option value="single">單張圖</option>
            <option value="0">左上</option><option value="1">上中</option><option value="2">右上</option>
            <option value="3">左中</option><option value="4">正中</option><option value="5">右中</option>
            <option value="6">左下</option><option value="7">下中</option><option value="8">右下</option>
          </select>
        </label>
        <canvas id="card-crop-preview" width="768" height="768" role="img" aria-label="發布前預覽"></canvas>
        <label>左右 <input id="card-crop-x" type="range" min="-100" max="100" value="0"></label>
        <label>上下 <input id="card-crop-y" type="range" min="-100" max="100" value="0"></label>
        <label>放大 <input id="card-crop-zoom" type="range" min="75" max="250" value="100"></label>
        <label><input id="card-remove-stars" type="checkbox" checked> 去掉上方星星</label>
        <label id="card-star-trim-field">去星星裁切幅度 <output id="card-star-value">6%</output>
          <input id="card-star-trim" type="range" min="0" max="35" value="6">
        </label>
      </div>
      <p id="card-edit-status" role="status"></p>
      <div class="actions">
        <button id="card-edit-save" type="submit" disabled>儲存並發布</button>
        <button id="card-edit-cancel" type="button">取消</button>
      </div>
    </form>
  </template>
</main>
</body>
</html>
