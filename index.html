<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="管理及查詢遊戲好友擁有的花種">
<title>好友花種圖鑑</title>
<link rel="stylesheet" href="./style.css"><script defer src="./seed.js"></script><script defer src="./app.js?v=flower-gallery-1"></script>
<script defer src="./flower-cards.js?v=4"></script>
<style>
.flower-card-button{display:inline-flex;vertical-align:middle;padding:0;margin:0 8px 0 0;border-radius:8px;overflow:hidden;background:#f1f6ee;line-height:0}
.flower-card-button img{width:42px;height:42px;object-fit:cover}
.flower-card-dialog{width:min(370px,calc(100vw - 32px));padding:16px;border:1px solid #dce4db;border-radius:15px;color:#243a30;text-align:center}
.flower-card-dialog::backdrop{background:#0f1e18a0}
.flower-card-dialog img{display:block;width:min(100%,280px);height:auto;margin:0 auto 12px;border-radius:10px;image-rendering:auto}
.flower-card-dialog h2{margin:0 0 12px;font-size:1.1rem}
.friend-management{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:12px}
.friend-management summary{cursor:pointer;font-weight:650}
.friend-management .actions{margin-top:8px}
.friend-management ul{list-style:none;padding:0;max-height:320px;overflow:auto}
.friend-management li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.friend-management li button{flex-shrink:0}
.friend-management button.danger{color:#9c302c}
#friend-management-status:empty{display:none}
nav{flex-wrap:wrap}
#gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
#gallery-grid button{display:grid;gap:6px;align-content:start;overflow-wrap:anywhere;padding:6px}
#gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#f1f6ee}
</style>
</head>
<body>
<header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">✿</span><span>好友花種圖鑑</span></div></header>
<main class="wrap">
  <section class="intro"><h1>好友花種圖鑑</h1><p>查找好友的花種，或上傳遊戲截圖更新收藏。</p>
    <div class="stats"><div><strong id="friend-count">—</strong> 位好友</div><div><strong id="flower-count">—</strong> 個花種</div><div><strong id="record-count">—</strong> 筆持有紀錄</div></div>
  </section>
  <nav aria-label="花冊功能"><button type="button" data-view="catalog" aria-current="page">花種總覽</button><button type="button" data-view="gallery">圖庫</button><button type="button" data-view="editor">新增／更新好友</button></nav>
  <div class="actions" style="margin-bottom:14px">
    <button type="button" id="export-backup">匯出好友備份</button>
    <button type="button" id="import-backup">匯入好友備份</button>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
  </div>
  <details style="margin:12px 0">
    <summary>管理共用花冊</summary>
    <label>GitHub 更新權杖<input id="shared-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p>發布後，任何持有網站網址的人都可查看好友暱稱與花種。權杖只用於本頁更新時。</p>
    <button id="publish-shared" type="button">發布目前好友資料</button>
    <p id="shared-admin-status" role="status"></p>
  </details>
  <details style="margin:12px 0">
    <summary>統一更正花名</summary>
    <form id="rename-flower-form">
      <div class="tools">
        <label>原花名<input id="old-flower-name" list="rename-flower-options" maxlength="80" required></label>
        <label>正確花名<input id="new-flower-name" list="rename-flower-options" maxlength="80" required></label>
      </div>
      <datalist id="rename-flower-options"></datalist>
      <p>更正會套用到圖鑑、圖卡與所有好友。若正確花名已存在，重複的持有紀錄會合併。</p>
      <button id="save-flower-name" type="submit">儲存共用花名</button>
      <p id="rename-flower-status" role="status"></p>
    </form>
  </details>
  <p id="shared-status" role="status"></p>
  <p id="connection" role="status">正在載入花冊…</p>
  <section id="catalog" class="page" hidden>
    <div class="tools">
      <label>搜尋花名<input id="search" type="search" placeholder="例如：滿天星"></label>
      <label>篩選好友<select id="filter"><option value="">所有好友</option></select></label>
      <label>顯示方式<select id="layout"><option value="list">持有人清單</option><option value="matrix">好友持有矩陣</option></select></label>
    </div>
    <div class="results"><p id="summary"></p><div class="pages"><button id="prev" type="button">上一頁</button><span id="page-number"></span><button id="next" type="button">下一頁</button></div></div>
    <div class="table-frame" tabindex="0" aria-label="花種及好友持有紀錄"><table id="inventory"></table></div>
  </section>
  <section id="gallery" class="page" hidden aria-label="花朵圖庫">
    <label>搜尋圖卡<input id="gallery-search" type="search" placeholder="輸入花名"></label>
    <div class="results"><p id="gallery-count" aria-live="polite"></p>
      <div class="pages"><button id="gallery-prev" type="button">上一頁</button><span id="gallery-page"></span><button id="gallery-next" type="button">下一頁</button></div>
    </div>
    <div id="gallery-grid"></div>
  </section>
  <section id="editor" class="page" hidden>
    <form id="entry">
      <div class="tools"><label>選擇好友<select id="friend"><option value="">新增好友</option></select></label>
      <label id="new-field">新好友名稱<input id="new-friend" maxlength="80" placeholder="輸入遊戲暱稱"></label></div>
      <details id="friend-management" class="friend-management" hidden>
        <summary>管理這位好友</summary>
        <fieldset id="friend-management-fields" style="border:0;padding:0;margin:10px 0 0;min-width:0">
          <label>好友名稱<input id="rename-friend" maxlength="80"></label>
          <div class="actions">
            <button id="save-friend-name" type="button">儲存新名字</button>
            <button id="delete-friend" class="danger" type="button">刪除整位好友</button>
          </div>
          <h3>已儲存的花</h3>
          <p id="friend-flower-empty" hidden>這位好友目前沒有花。</p>
          <ul id="friend-flowers" aria-label="已儲存的花"></ul>
        </fieldset>
        <p id="friend-management-status" role="status"></p>
      </details>
      <div class="upload"><label for="screenshots">上傳遊戲截圖</label><p>可選多張圖片。請確認截圖中顯示清楚的花名。</p><input type="file" id="screenshots" accept="image/*" multiple>
      <div id="previews" class="previews"></div></div>
      <label for="manual">手動輸入花名（選填）</label>
      <textarea id="manual" rows="3" placeholder="每行一個花名，也可用頓號分隔"></textarea>
      <button class="primary" id="review-button">前往確認</button>
      <p id="progress" role="status"></p>
    </form>
    <section id="review" hidden>
      <h2>確認花名</h2><p id="target"></p><div id="review-images" class="previews"></div>
      <div id="review-rows"></div>
      <button type="button" id="add-row">新增一列</button>
      <details id="ocr-details" hidden><summary>查看原始辨識文字</summary><pre id="ocr-raw"></pre></details>
      <p id="review-message" role="status"></p>
      <div class="actions"><button type="button" id="back">返回上傳</button><button class="primary" type="button" id="save">確認並儲存</button></div>
    </section>
  </section>
</main>
</body>
</html>
